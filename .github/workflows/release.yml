name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, for example v0.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          git fetch --tags
          if git rev-parse "${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ github.event.inputs.version }} already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ github.event.inputs.version }}"
          git push origin "${{ github.event.inputs.version }}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--draft)
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi

          gh release create "${{ github.event.inputs.version }}" \
            --title "Faker.cpp ${{ github.event.inputs.version }}" \
            --notes "Manual Faker.cpp release built from ${{ github.sha }}." \
            "${flags[@]}"

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            asset: faker-cpp-${{ github.event.inputs.version }}-linux-x64.zip
            benchmark: build/faker_benchmark
            perf_json: performance-linux-x64.json
            perf_md: performance-linux-x64.md
          - name: windows
            os: windows-latest
            asset: faker-cpp-${{ github.event.inputs.version }}-windows-x64.zip
            benchmark: build/Release/faker_benchmark.exe
            perf_json: performance-windows-x64.json
            perf_md: performance-windows-x64.md

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFAKER_BUILD_TESTS=ON -DFAKER_BUILD_EXAMPLES=ON -DFAKER_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix package/Faker.cpp

      - name: Add documentation
        run: |
          cmake -E make_directory package/Faker.cpp/docs
          cmake -E copy README.md package/Faker.cpp/
          cmake -E copy_directory docs/src package/Faker.cpp/docs/src
          cmake -E copy docs/book.toml package/Faker.cpp/docs/book.toml

      - name: Create archive
        run: cmake -E tar cfv "${{ matrix.asset }}" --format=zip package/Faker.cpp

      - name: Find previous performance metric
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p previous-performance
          previous_tag="$(gh release list --exclude-drafts --limit 20 | awk -v current="${{ github.event.inputs.version }}" '$1 != current { print $1; exit }')"
          if [ -n "$previous_tag" ]; then
            gh release download "$previous_tag" \
              --pattern "${{ matrix.perf_json }}" \
              --dir previous-performance || true
          fi

          if [ -f "previous-performance/${{ matrix.perf_json }}" ]; then
            echo "args=--previous previous-performance/${{ matrix.perf_json }}" >> "$GITHUB_OUTPUT"
            echo "Previous performance metric: $previous_tag/${{ matrix.perf_json }}"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "No previous performance metric found."
          fi

      - name: Run performance benchmark
        shell: bash
        run: |
          "${{ matrix.benchmark }}" \
            --rows 1000000 \
            --version "${{ github.event.inputs.version }}" \
            --commit "${{ github.sha }}" \
            --os "${{ matrix.name }}-x64" \
            --output-json "${{ matrix.perf_json }}" \
            --output-md "${{ matrix.perf_md }}" \
            ${{ steps.previous.outputs.args }}

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.inputs.version }}" "${{ matrix.asset }}" "${{ matrix.perf_json }}" "${{ matrix.perf_md }}" --clobber

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.event.inputs.version }}" --draft=false
