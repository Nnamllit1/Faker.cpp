name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, for example v0.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean
      release_area:
        description: "Main kind of release notes to show"
        required: true
        default: "Auto"
        type: choice
        options:
          - "Auto"
          - "Documentation"
          - "Bug fixes"
          - "New features"
          - "Performance"
          - "Maintenance"
          - "Mixed"
      runtime_changed:
        description: "Generator/runtime code changed in this release"
        required: true
        default: true
        type: boolean
      release_highlights:
        description: "Optional highlight bullets, separated with |"
        required: false
        type: string
      release_notes:
        description: "Optional extra note for the release highlights"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          git fetch --tags
          if git rev-parse "${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ github.event.inputs.version }} already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ github.event.inputs.version }}"
          git push origin "${{ github.event.inputs.version }}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--draft)
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi

          gh release create "${{ github.event.inputs.version }}" \
            --title "Faker.cpp ${{ github.event.inputs.version }}" \
            --notes "Manual Faker.cpp release built from ${{ github.sha }}." \
            "${flags[@]}"

  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            asset: faker-cpp-${{ github.event.inputs.version }}-linux-x64.zip
          - name: windows
            os: windows-latest
            asset: faker-cpp-${{ github.event.inputs.version }}-windows-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFAKER_BUILD_TESTS=ON -DFAKER_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix package/Faker.cpp

      - name: Add documentation
        run: |
          cmake -E make_directory package/Faker.cpp/docs
          cmake -E copy README.md package/Faker.cpp/
          cmake -E copy LICENSE package/Faker.cpp/
          cmake -E copy CONTRIBUTING.md package/Faker.cpp/
          cmake -E copy_directory docs/src package/Faker.cpp/docs/src
          cmake -E copy docs/book.toml package/Faker.cpp/docs/book.toml

      - name: Create archive
        run: cmake -E tar cfv "${{ matrix.asset }}" --format=zip package/Faker.cpp

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.inputs.version }}" "${{ matrix.asset }}" --clobber

  performance:
    name: Performance ${{ matrix.platform.name }} runner ${{ matrix.runner_index }}
    runs-on: ${{ matrix.platform.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner_index: [1, 2, 3, 4, 5]
        platform:
          - name: linux
            os: ubuntu-latest
            benchmark: build/faker_benchmark
          - name: windows
            os: windows-latest
            benchmark: build/Release/faker_benchmark.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure benchmark
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFAKER_BUILD_TESTS=OFF -DFAKER_BUILD_EXAMPLES=OFF -DFAKER_BUILD_BENCHMARKS=ON

      - name: Build benchmark
        run: cmake --build build --config Release --target faker_benchmark

      - name: Run performance benchmark
        shell: bash
        run: |
          "${{ matrix.platform.benchmark }}" \
            --rows 1000000 \
            --runs 2 \
            --version "${{ github.event.inputs.version }}" \
            --commit "${{ github.sha }}" \
            --os "${{ matrix.platform.name }}-x64" \
            --output-json "tmp-performance-${{ matrix.platform.name }}-x64-run-${{ matrix.runner_index }}.json" \
            --output-md performance-local.md

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.inputs.version }}" "tmp-performance-${{ matrix.platform.name }}-x64-run-${{ matrix.runner_index }}.json" --clobber

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [package, performance]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current performance metrics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p current-performance
          gh release download "${{ github.event.inputs.version }}" \
            --pattern "tmp-performance-*.json" \
            --dir current-performance

      - name: Download previous combined performance metric
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p previous-performance
          previous_tag="$(gh release list --exclude-drafts --limit 20 --json tagName --jq '.[].tagName' | awk -v current="${{ github.event.inputs.version }}" '$0 != current { print; exit }')"
          if [ -n "$previous_tag" ]; then
            gh release download "$previous_tag" \
              --pattern "performance.json" \
              --dir previous-performance || true
          fi

      - name: Combine performance report
        env:
          RELEASE_AREA: ${{ github.event.inputs.release_area }}
          RELEASE_HIGHLIGHTS: ${{ github.event.inputs.release_highlights }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          RUNTIME_CHANGED: ${{ github.event.inputs.runtime_changed }}
        run: |
          previous_args=()
          if [ -f previous-performance/performance.json ]; then
            previous_args=(--previous previous-performance/performance.json)
          fi

          python3 bench/combine_performance.py \
            --version "${{ github.event.inputs.version }}" \
            --commit "${{ github.sha }}" \
            --output-json performance.json \
            --output-md performance.md \
            --release-body release-body.md \
            --release-area "$RELEASE_AREA" \
            --release-highlights "$RELEASE_HIGHLIGHTS" \
            --release-notes "$RELEASE_NOTES" \
            --runtime-changed "$RUNTIME_CHANGED" \
            "${previous_args[@]}" \
            current-performance/tmp-performance-*.json

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.event.inputs.version }}" --notes-file release-body.md --draft=false

      - name: Replace temporary metrics with combined reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.inputs.version }}" performance.json performance.md --clobber

          for asset in $(gh release view "${{ github.event.inputs.version }}" --json assets --jq '.assets[].name | select(startswith("tmp-performance-"))'); do
            asset_id="$(gh api "repos/${GH_REPO}/releases/tags/${{ github.event.inputs.version }}" --jq ".assets[] | select(.name == \"${asset}\") | .id")"
            gh api --method DELETE "repos/${GH_REPO}/releases/assets/${asset_id}"
          done
